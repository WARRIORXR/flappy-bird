<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ec0ca"/>
      <stop offset="100%" stop-color="#70c5ce"/>
    </linearGradient>
    <linearGradient id="birdBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#F0A500"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55bb44"/>
      <stop offset="35%" stop-color="#88ee55"/>
      <stop offset="80%" stop-color="#44aa33"/>
      <stop offset="100%" stop-color="#226611"/>
    </linearGradient>
  </defs>

  <!-- Background rounded circle/squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Background pipe segment decoration -->
  <rect x="360" y="280" width="100" height="232" rx="6" fill="url(#pipeGrad)" stroke="#1a4d1a" stroke-width="8"/>
  <rect x="345" y="280" width="130" height="42" rx="6" fill="url(#pipeGrad)" stroke="#1a4d1a" stroke-width="8"/>

  <!-- Clouds -->
  <ellipse cx="140" cy="130" rx="60" ry="35" fill="white" opacity="0.85"/>
  <ellipse cx="180" cy="115" rx="50" ry="40" fill="white" opacity="0.85"/>
  <ellipse cx="220" cy="130" rx="55" ry="30" fill="white" opacity="0.85"/>

  <!-- Bird Body -->
  <g transform="translate(160, 210)">
    <!-- Main Body Ellipse -->
    <ellipse cx="80" cy="80" rx="75" ry="60" fill="url(#birdBody)" stroke="#543847" stroke-width="10"/>

    <!-- Cream Underbelly -->
    <path d="M 30,85 C 40,120 100,135 135,100 C 110,125 50,125 30,85 Z" fill="#FFF3B0"/>

    <!-- Wing -->
    <ellipse cx="45" cy="80" rx="42" ry="26" transform="rotate(-15, 45, 80)" fill="#FFF" stroke="#543847" stroke-width="8"/>

    <!-- Eye (Large White + Pupil + Highlight) -->
    <ellipse cx="115" cy="55" rx="26" ry="30" fill="#FFF" stroke="#543847" stroke-width="9"/>
    <ellipse cx="122" cy="55" rx="12" ry="15" fill="#000"/>
    <circle cx="127" cy="48" r="5" fill="#FFF"/>

    <!-- Cheeks Blush -->
    <ellipse cx="95" cy="88" rx="14" ry="10" fill="#FF8A80" opacity="0.6"/>

    <!-- Beak / Lips -->
    <path d="M 135,68 Q 185,75 160,95 Q 135,90 135,68 Z" fill="#FF5722" stroke="#543847" stroke-width="8"/>
    <path d="M 135,90 Q 175,95 150,110 Q 135,100 135,90 Z" fill="#F44336" stroke="#543847" stroke-width="8"/>
  </g>
</svg>
