name: Multi-Platform Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os-name }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            target: x86_64-pc-windows-msvc
            bin-source: flappy-bird-rust/target/release/flappy-bird-rust.exe
            bin-dest: flappy-bird-windows-x64.exe
          - os: ubuntu-latest
            os-name: Linux
            target: x86_64-unknown-linux-gnu
            bin-source: flappy-bird-rust/target/release/flappy-bird-rust
            bin-dest: flappy-bird-linux-x64
          - os: macos-latest
            os-name: macOS-AppleSilicon
            target: aarch64-apple-darwin
            bin-source: flappy-bird-rust/target/release/flappy-bird-rust
            bin-dest: flappy-bird-macos-arm64
          - os: macos-13
            os-name: macOS-Intel
            target: x86_64-apple-darwin
            bin-source: flappy-bird-rust/target/release/flappy-bird-rust
            bin-dest: flappy-bird-macos-x86_64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Native Release Binary
        working-directory: flappy-bird-rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp "flappy-bird-rust/target/${{ matrix.target }}/release/flappy-bird-rust.exe" "${{ matrix.bin-dest }}"
          else
            cp "flappy-bird-rust/target/${{ matrix.target }}/release/flappy-bird-rust" "${{ matrix.bin-dest }}"
            chmod +x "${{ matrix.bin-dest }}"
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin-dest }}
          path: ${{ matrix.bin-dest }}

  create-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
