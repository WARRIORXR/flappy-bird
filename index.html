<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
/* ========== GLOBAL STYLES ========== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  /* Prevent pull-to-refresh and bounce on mobile */
  overscroll-behavior: none;
  touch-action: none;
}

canvas {
  display: block;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  /* Crisp pixel rendering */
  image-rendering: pixelated;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
// =============================================================================
// FLAPPY BIRD CLONE — Single-file HTML5 Canvas Game
// =============================================================================
// Organized into clear sections:
//   1. CONSTANTS (easy-to-tweak)
//   2. CANVAS & RESPONSIVE SETUP
//   3. WEB AUDIO API (sound effects)
//   4. GAME STATE
//   5. CLOUD SYSTEM (parallax background)
//   6. BIRD
//   7. PIPES
//   8. GROUND
//   9. COLLISION DETECTION
//  10. RENDERING
//  11. SCREENS (start, game over)
//  12. INPUT HANDLING
//  13. GAME LOOP
// =============================================================================


// =============================================================================
// 1. CONSTANTS — Tweak these to adjust gameplay feel
// =============================================================================
const GAME_WIDTH  = 400;   // Virtual canvas width (scales to screen)
const GAME_HEIGHT = 700;   // Virtual canvas height

// Bird physics
const GRAVITY       = 0.55;   // Downward acceleration per frame (at 60fps baseline)
const FLAP_STRENGTH = -8.5;   // Upward velocity on flap (negative = up)
const MAX_FALL_SPEED = 12;    // Terminal velocity

// Bird dimensions & position
const BIRD_X      = 80;    // Horizontal position (fixed)
const BIRD_WIDTH  = 38;    // Width of the bird
const BIRD_HEIGHT = 28;    // Height of the bird

// Pipe settings
const PIPE_WIDTH     = 60;    // Width of each pipe
const PIPE_GAP       = 150;   // Vertical gap between top and bottom pipe
const PIPE_SPACING   = 220;   // Horizontal distance between pipe pairs
const PIPE_SPEED     = 2.5;   // Base horizontal scroll speed (pixels per frame at 60fps)
const PIPE_SPEED_INC = 0.08;  // Speed increase per scored point
const PIPE_MAX_SPEED = 6.0;   // Maximum pipe speed cap

// Ground
const GROUND_HEIGHT  = 80;    // Height of the ground strip
const GROUND_SPEED_MULT = 1;  // Ground scrolls at pipe speed × this

// Clouds
const NUM_CLOUDS     = 6;
const CLOUD_MIN_SPEED = 0.3;
const CLOUD_MAX_SPEED = 0.8;

// Wing animation
const WING_FLAP_SPEED = 0.15; // Wing oscillation speed

// Rotation limits (radians)
const MAX_UP_ROTATION   = -0.5;  // Bird tilts up when flapping
const MAX_DOWN_ROTATION = 1.2;   // Bird tilts down when falling


// =============================================================================
// 2. CANVAS & RESPONSIVE SETUP
// =============================================================================
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

canvas.width  = GAME_WIDTH;
canvas.height = GAME_HEIGHT;

/** Scale the canvas to fit the window while maintaining aspect ratio */
function resizeCanvas() {
  const scaleX = window.innerWidth / GAME_WIDTH;
  const scaleY = window.innerHeight / GAME_HEIGHT;
  const scale  = Math.min(scaleX, scaleY);

  canvas.style.width  = (GAME_WIDTH * scale) + 'px';
  canvas.style.height = (GAME_HEIGHT * scale) + 'px';
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();


// =============================================================================
// 3. WEB AUDIO API — Simple sound effects (flap, score, hit)
// =============================================================================
let audioCtx = null;

/** Initialize AudioContext on first user interaction (browser policy) */
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

/**
 * Play a tone with given parameters.
 * @param {number} freq      - Frequency in Hz
 * @param {string} type      - Oscillator type ('sine', 'square', 'triangle', 'sawtooth')
 * @param {number} duration  - Duration in seconds
 * @param {number} volume    - Volume (0–1)
 * @param {number} freqEnd   - Optional end frequency for pitch slide
 */
function playTone(freq, type, duration, volume = 0.3, freqEnd = null) {
  if (!audioCtx) return;
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (freqEnd !== null) {
    osc.frequency.linearRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
  }
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function soundFlap()  { playTone(400, 'sine', 0.1, 0.2, 600); }
function soundScore() { playTone(600, 'triangle', 0.1, 0.25); setTimeout(() => playTone(900, 'triangle', 0.15, 0.25), 80); }
function soundHit()   { playTone(200, 'square', 0.3, 0.3, 80); }


// =============================================================================
// 4. GAME STATE
// =============================================================================
const State = { START: 0, PLAYING: 1, GAME_OVER: 2 };

let gameState  = State.START;
let score      = 0;
let bestScore  = 0;       // Best score for this session
let paused     = false;
let lastTime   = 0;       // For delta-time calculation


// =============================================================================
// 5. CLOUD SYSTEM — Parallax background decoration
// =============================================================================
let clouds = [];

/** Create a single cloud with random properties */
function createCloud(startOffScreen = false) {
  return {
    x: startOffScreen
      ? GAME_WIDTH + Math.random() * 200
      : Math.random() * GAME_WIDTH,
    y: 30 + Math.random() * (GAME_HEIGHT * 0.4),
    w: 50 + Math.random() * 70,
    h: 20 + Math.random() * 25,
    speed: CLOUD_MIN_SPEED + Math.random() * (CLOUD_MAX_SPEED - CLOUD_MIN_SPEED),
    opacity: 0.3 + Math.random() * 0.4,
  };
}

/** Initialize clouds at random positions */
function initClouds() {
  clouds = [];
  for (let i = 0; i < NUM_CLOUDS; i++) {
    clouds.push(createCloud(false));
  }
}

/** Update cloud positions (parallax scroll) */
function updateClouds(dt) {
  for (const c of clouds) {
    c.x -= c.speed * dt;
    if (c.x + c.w < 0) {
      // Recycle cloud at right edge
      Object.assign(c, createCloud(true));
    }
  }
}

/** Draw clouds as soft ellipses */
function drawClouds() {
  for (const c of clouds) {
    ctx.save();
    ctx.globalAlpha = c.opacity;
    ctx.fillStyle = '#fff';
    // Main body
    ctx.beginPath();
    ctx.ellipse(c.x + c.w / 2, c.y + c.h / 2, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    // Bumps
    ctx.beginPath();
    ctx.ellipse(c.x + c.w * 0.3, c.y, c.w * 0.25, c.h * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x + c.w * 0.65, c.y + c.h * 0.1, c.w * 0.3, c.h * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}


// =============================================================================
// 6. BIRD
// =============================================================================
let bird = {};

function resetBird() {
  bird = {
    x: BIRD_X,
    y: GAME_HEIGHT / 2 - 50,
    vy: 0,                   // Vertical velocity
    rotation: 0,             // Current tilt angle (radians)
    wingAngle: 0,            // For wing flap animation
    wingDir: 1,              // Wing direction toggle
    flapTimer: 0,            // Timer for flap visual effect
  };
}

/** Make the bird flap */
function flap() {
  bird.vy = FLAP_STRENGTH;
  bird.flapTimer = 8;  // Frames of flap visual
  soundFlap();
}

/** Update bird physics */
function updateBird(dt) {
  // Apply gravity (scaled by dt for frame-rate independence)
  bird.vy += GRAVITY * dt;
  if (bird.vy > MAX_FALL_SPEED) bird.vy = MAX_FALL_SPEED;
  bird.y += bird.vy * dt;

  // Rotation: tilt up on flap, tilt down when falling
  if (bird.vy < 0) {
    bird.rotation = Math.max(MAX_UP_ROTATION, bird.rotation - 0.08 * dt);
  } else {
    bird.rotation = Math.min(MAX_DOWN_ROTATION, bird.rotation + 0.04 * dt);
  }

  // Wing flap animation
  bird.wingAngle += WING_FLAP_SPEED * bird.wingDir * dt;
  if (bird.wingAngle > 1 || bird.wingAngle < -0.5) bird.wingDir *= -1;
  if (bird.flapTimer > 0) bird.flapTimer -= dt;
}

/** Draw the bird (all shapes, no images) */
function drawBird() {
  ctx.save();
  ctx.translate(bird.x + BIRD_WIDTH / 2, bird.y + BIRD_HEIGHT / 2);
  ctx.rotate(bird.rotation);

  const bw = BIRD_WIDTH;
  const bh = BIRD_HEIGHT;
  const hx = -bw / 2;  // Half offset x
  const hy = -bh / 2;  // Half offset y

  // Body — yellow oval
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.ellipse(0, 0, bw / 2, bh / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#DAA520';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Belly — lighter oval
  ctx.fillStyle = '#FFF3B0';
  ctx.beginPath();
  ctx.ellipse(2, 3, bw * 0.3, bh * 0.32, 0, 0, Math.PI * 2);
  ctx.fill();

  // Wing — animated flap
  const wingY = 2 + bird.wingAngle * 6;
  ctx.fillStyle = '#F0A500';
  ctx.beginPath();
  ctx.ellipse(-4, wingY, 10, 6, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#DAA520';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Eye — white circle with black pupil
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(bw * 0.22, -bh * 0.15, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(bw * 0.26, -bh * 0.15, 3, 0, Math.PI * 2);
  ctx.fill();

  // Beak — orange triangle
  ctx.fillStyle = '#FF6600';
  ctx.beginPath();
  ctx.moveTo(bw * 0.4, -2);
  ctx.lineTo(bw * 0.65, 2);
  ctx.lineTo(bw * 0.4, 5);
  ctx.closePath();
  ctx.fill();

  // Tail feathers
  ctx.fillStyle = '#F0A500';
  ctx.beginPath();
  ctx.moveTo(-bw * 0.45, -4);
  ctx.lineTo(-bw * 0.7, -8);
  ctx.lineTo(-bw * 0.5, 0);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-bw * 0.45, 0);
  ctx.lineTo(-bw * 0.7, 4);
  ctx.lineTo(-bw * 0.45, 6);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}


// =============================================================================
// 7. PIPES
// =============================================================================
let pipes = [];

/** Get current pipe speed based on score */
function getPipeSpeed() {
  return Math.min(PIPE_SPEED + score * PIPE_SPEED_INC, PIPE_MAX_SPEED);
}

/** Spawn a new pipe pair */
function spawnPipe(x) {
  // Random gap position (leave room for gap + ground)
  const minTop = 60;
  const maxTop = GAME_HEIGHT - GROUND_HEIGHT - PIPE_GAP - 60;
  const topHeight = minTop + Math.random() * (maxTop - minTop);

  pipes.push({
    x: x,
    topHeight: topHeight,           // Bottom edge of top pipe
    bottomY: topHeight + PIPE_GAP,  // Top edge of bottom pipe
    scored: false,                  // Has the bird passed this pipe?
    width: PIPE_WIDTH,
  });
}

/** Initialize pipes */
function resetPipes() {
  pipes = [];
  // Spawn initial pipes off-screen to the right
  for (let i = 0; i < 4; i++) {
    spawnPipe(GAME_WIDTH + 100 + i * PIPE_SPACING);
  }
}

/** Update pipe positions and scoring */
function updatePipes(dt) {
  const speed = getPipeSpeed();

  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= speed * dt;

    // Score when bird passes the pipe's right edge
    if (!p.scored && p.x + p.width < bird.x) {
      p.scored = true;
      score++;
      soundScore();
    }

    // Remove pipes that are fully off-screen left
    if (p.x + p.width < -10) {
      pipes.splice(i, 1);
    }
  }

  // Spawn new pipes as needed
  if (pipes.length > 0) {
    const lastPipe = pipes[pipes.length - 1];
    if (lastPipe.x < GAME_WIDTH - PIPE_SPACING + PIPE_WIDTH) {
      spawnPipe(lastPipe.x + PIPE_SPACING);
    }
  }
}

/** Draw a single pipe (with shading & cap) */
function drawPipe(x, y, w, h, isTop) {
  // Main pipe body — green gradient
  const grad = ctx.createLinearGradient(x, 0, x + w, 0);
  grad.addColorStop(0, '#3CB043');
  grad.addColorStop(0.3, '#5CD85C');
  grad.addColorStop(0.7, '#5CD85C');
  grad.addColorStop(1, '#2E8B2E');
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, h);

  // Pipe border
  ctx.strokeStyle = '#1E6B1E';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);

  // Cap (wider rectangle at the opening)
  const capW = w + 10;
  const capH = 26;
  const capX = x - 5;
  const capY = isTop ? y + h - capH : y;

  const capGrad = ctx.createLinearGradient(capX, 0, capX + capW, 0);
  capGrad.addColorStop(0, '#3CB043');
  capGrad.addColorStop(0.25, '#6AE86A');
  capGrad.addColorStop(0.75, '#6AE86A');
  capGrad.addColorStop(1, '#2E8B2E');
  ctx.fillStyle = capGrad;
  ctx.fillRect(capX, capY, capW, capH);

  ctx.strokeStyle = '#1E6B1E';
  ctx.lineWidth = 2;
  ctx.strokeRect(capX, capY, capW, capH);

  // Highlight stripe
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(x + 8, y, 6, h);
}

/** Draw all pipes */
function drawPipes() {
  for (const p of pipes) {
    // Top pipe: from y=0 down to topHeight
    drawPipe(p.x, 0, p.width, p.topHeight, true);
    // Bottom pipe: from bottomY down to ground
    const bottomH = GAME_HEIGHT - GROUND_HEIGHT - p.bottomY;
    drawPipe(p.x, p.bottomY, p.width, bottomH, false);
  }
}


// =============================================================================
// 8. GROUND
// =============================================================================
let groundOffset = 0;

/** Update scrolling ground */
function updateGround(dt) {
  const speed = getPipeSpeed() * GROUND_SPEED_MULT;
  groundOffset = (groundOffset + speed * dt) % 24;
}

/** Draw the ground strip */
function drawGround() {
  const gy = GAME_HEIGHT - GROUND_HEIGHT;

  // Dirt layer
  ctx.fillStyle = '#DEB887';
  ctx.fillRect(0, gy, GAME_WIDTH, GROUND_HEIGHT);

  // Top grass layer
  const grassH = 20;
  const grassGrad = ctx.createLinearGradient(0, gy, 0, gy + grassH);
  grassGrad.addColorStop(0, '#4CAF50');
  grassGrad.addColorStop(1, '#388E3C');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, gy, GAME_WIDTH, grassH);

  // Grass edge highlight
  ctx.fillStyle = '#66BB6A';
  ctx.fillRect(0, gy, GAME_WIDTH, 3);

  // Dirt texture — scrolling chevron pattern
  ctx.strokeStyle = '#C8A96E';
  ctx.lineWidth = 1;
  for (let i = -1; i < GAME_WIDTH / 24 + 2; i++) {
    const bx = i * 24 - groundOffset;
    ctx.beginPath();
    ctx.moveTo(bx, gy + grassH + 10);
    ctx.lineTo(bx + 12, gy + grassH + 25);
    ctx.lineTo(bx + 24, gy + grassH + 10);
    ctx.stroke();
  }

  // Pebbles
  ctx.fillStyle = '#A0896E';
  for (let i = 0; i < GAME_WIDTH / 40; i++) {
    const px = (i * 40 + 15 - groundOffset * 0.5) % GAME_WIDTH;
    ctx.beginPath();
    ctx.ellipse(px, gy + grassH + 8, 3, 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}


// =============================================================================
// 9. COLLISION DETECTION
// =============================================================================

/** Check if the bird collides with any pipe, ground, or ceiling */
function checkCollision() {
  // Hitbox — slightly smaller than visual for fairness
  const margin = 3;
  const bx = bird.x + margin;
  const by = bird.y + margin;
  const bw = BIRD_WIDTH - margin * 2;
  const bh = BIRD_HEIGHT - margin * 2;

  // Ceiling
  if (by <= 0) return true;

  // Ground
  if (by + bh >= GAME_HEIGHT - GROUND_HEIGHT) return true;

  // Pipes
  for (const p of pipes) {
    // Horizontal overlap?
    if (bx + bw > p.x && bx < p.x + p.width) {
      // Top pipe collision
      if (by < p.topHeight) return true;
      // Bottom pipe collision
      if (by + bh > p.bottomY) return true;
    }
  }

  return false;
}


// =============================================================================
// 10. RENDERING — Background, score display
// =============================================================================

/** Draw sky gradient background */
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
  grad.addColorStop(0, '#87CEEB');   // Light sky blue
  grad.addColorStop(0.6, '#B0E0FF'); // Lighter blue
  grad.addColorStop(1, '#E0F0FF');   // Near-white at horizon
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
}

/** Draw the live score at the top center */
function drawScore() {
  ctx.save();
  ctx.font = 'bold 48px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillText(score, GAME_WIDTH / 2 + 2, 22);

  // White text
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3;
  ctx.strokeText(score, GAME_WIDTH / 2, 20);
  ctx.fillText(score, GAME_WIDTH / 2, 20);

  ctx.restore();
}

/** Draw pause indicator */
function drawPauseOverlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  ctx.font = 'bold 40px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText('PAUSED', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 20);

  ctx.font = '20px Arial, sans-serif';
  ctx.fillStyle = '#ddd';
  ctx.fillText('Press P to resume', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 25);
  ctx.restore();
}


// =============================================================================
// 11. SCREENS — Start screen and Game Over screen
// =============================================================================

/** Draw the start screen */
function drawStartScreen(time) {
  drawBackground();
  updateClouds(1);
  drawClouds();
  drawGround();

  // Title
  ctx.save();
  ctx.font = 'bold 52px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillText('Flappy Bird', GAME_WIDTH / 2 + 3, 160 + 3);

  // Gradient text
  const tGrad = ctx.createLinearGradient(0, 130, 0, 190);
  tGrad.addColorStop(0, '#FFD700');
  tGrad.addColorStop(1, '#FF8C00');
  ctx.fillStyle = tGrad;
  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 4;
  ctx.strokeText('Flappy Bird', GAME_WIDTH / 2, 160);
  ctx.fillText('Flappy Bird', GAME_WIDTH / 2, 160);

  // Animated bird preview
  const previewY = 310 + Math.sin(time * 0.003) * 15;
  ctx.save();
  ctx.translate(GAME_WIDTH / 2, previewY);
  // Body
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.ellipse(0, 0, 28, 20, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#DAA520';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Belly
  ctx.fillStyle = '#FFF3B0';
  ctx.beginPath();
  ctx.ellipse(3, 4, 14, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  // Wing
  const wingY = Math.sin(time * 0.008) * 6;
  ctx.fillStyle = '#F0A500';
  ctx.beginPath();
  ctx.ellipse(-6, wingY, 12, 7, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#DAA520';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(14, -6, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.stroke();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(16, -6, 3.5, 0, Math.PI * 2);
  ctx.fill();
  // Beak
  ctx.fillStyle = '#FF6600';
  ctx.beginPath();
  ctx.moveTo(24, -2);
  ctx.lineTo(36, 3);
  ctx.lineTo(24, 7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Instructions — pulsing
  const alpha = 0.5 + Math.sin(time * 0.004) * 0.4;
  ctx.globalAlpha = alpha;
  ctx.font = '22px Arial, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.strokeText('Tap / Press Space to Start', GAME_WIDTH / 2, 440);
  ctx.fillText('Tap / Press Space to Start', GAME_WIDTH / 2, 440);
  ctx.globalAlpha = 1;

  // Controls info
  ctx.font = '16px Arial, sans-serif';
  ctx.fillStyle = '#666';
  ctx.fillText('P to Pause', GAME_WIDTH / 2, 520);

  ctx.restore();
}

/** Draw the game over screen */
function drawGameOverScreen() {
  // Dim overlay
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // "GAME OVER" title
  ctx.font = 'bold 46px Arial, sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillText('GAME OVER', GAME_WIDTH / 2 + 2, 192);
  ctx.fillStyle = '#FF4444';
  ctx.strokeStyle = '#8B0000';
  ctx.lineWidth = 3;
  ctx.strokeText('GAME OVER', GAME_WIDTH / 2, 190);
  ctx.fillText('GAME OVER', GAME_WIDTH / 2, 190);

  // Score panel background
  const panelX = GAME_WIDTH / 2 - 120;
  const panelY = 240;
  const panelW = 240;
  const panelH = 160;

  // Panel shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  roundRect(ctx, panelX + 4, panelY + 4, panelW, panelH, 12);
  ctx.fill();

  // Panel body
  ctx.fillStyle = '#F5DEB3';
  roundRect(ctx, panelX, panelY, panelW, panelH, 12);
  ctx.fill();
  ctx.strokeStyle = '#8B7355';
  ctx.lineWidth = 3;
  roundRect(ctx, panelX, panelY, panelW, panelH, 12);
  ctx.stroke();

  // Score
  ctx.font = '22px Arial, sans-serif';
  ctx.fillStyle = '#555';
  ctx.fillText('Score', GAME_WIDTH / 2, panelY + 35);

  ctx.font = 'bold 40px Arial, sans-serif';
  ctx.fillStyle = '#333';
  ctx.fillText(score, GAME_WIDTH / 2, panelY + 72);

  // Divider
  ctx.strokeStyle = '#C8A96E';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(panelX + 20, panelY + 95);
  ctx.lineTo(panelX + panelW - 20, panelY + 95);
  ctx.stroke();

  // Best score
  ctx.font = '18px Arial, sans-serif';
  ctx.fillStyle = '#888';
  ctx.fillText('Best', GAME_WIDTH / 2, panelY + 115);

  ctx.font = 'bold 28px Arial, sans-serif';
  ctx.fillStyle = score >= bestScore ? '#FFD700' : '#555';
  ctx.fillText(bestScore, GAME_WIDTH / 2, panelY + 143);

  // New best indicator
  if (score >= bestScore && score > 0) {
    ctx.font = 'bold 16px Arial, sans-serif';
    ctx.fillStyle = '#FF6600';
    ctx.fillText('★ NEW BEST! ★', GAME_WIDTH / 2, panelY + panelH + 25);
  }

  // Restart button
  const btnX = GAME_WIDTH / 2 - 80;
  const btnY = 455;
  const btnW = 160;
  const btnH = 48;

  // Button shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  roundRect(ctx, btnX + 3, btnY + 3, btnW, btnH, 10);
  ctx.fill();

  // Button body
  const btnGrad = ctx.createLinearGradient(0, btnY, 0, btnY + btnH);
  btnGrad.addColorStop(0, '#5CD85C');
  btnGrad.addColorStop(1, '#3CB043');
  ctx.fillStyle = btnGrad;
  roundRect(ctx, btnX, btnY, btnW, btnH, 10);
  ctx.fill();
  ctx.strokeStyle = '#2E8B2E';
  ctx.lineWidth = 2;
  roundRect(ctx, btnX, btnY, btnW, btnH, 10);
  ctx.stroke();

  ctx.font = 'bold 22px Arial, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('Restart', GAME_WIDTH / 2, btnY + btnH / 2);

  // Hint
  ctx.font = '16px Arial, sans-serif';
  ctx.fillStyle = '#ccc';
  ctx.fillText('or press Space', GAME_WIDTH / 2, btnY + btnH + 28);

  ctx.restore();
}

/** Helper: draw a rounded rectangle path */
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}


// =============================================================================
// 12. INPUT HANDLING
// =============================================================================

/** Handle a "tap" action (space, click, or touch) */
function handleTap() {
  initAudio();

  if (gameState === State.START) {
    startGame();
  } else if (gameState === State.PLAYING && !paused) {
    flap();
  } else if (gameState === State.GAME_OVER) {
    restartGame();
  }
}

/** Start a new game from the start screen */
function startGame() {
  gameState = State.PLAYING;
  score = 0;
  paused = false;
  resetBird();
  resetPipes();
  flap(); // Initial flap to start
}

/** Restart after game over */
function restartGame() {
  startGame();
}

/** Trigger game over */
function gameOver() {
  gameState = State.GAME_OVER;
  soundHit();
  if (score > bestScore) {
    bestScore = score;
  }
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    handleTap();
  }
  if (e.code === 'KeyP' && gameState === State.PLAYING) {
    e.preventDefault();
    paused = !paused;
  }
});

// Mouse click
canvas.addEventListener('mousedown', (e) => {
  e.preventDefault();
  handleTap();
});

// Touch (mobile)
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  handleTap();
}, { passive: false });


// =============================================================================
// 13. GAME LOOP — requestAnimationFrame with delta-time
// =============================================================================

/**
 * Main game loop.
 * Uses delta-time so physics are consistent regardless of refresh rate.
 * dt is normalized so that 1.0 = one frame at 60fps (≈16.67ms).
 */
function gameLoop(timestamp) {
  // Calculate delta time (normalized to 60fps frame)
  if (lastTime === 0) lastTime = timestamp;
  const rawDt = timestamp - lastTime;
  lastTime = timestamp;

  // Clamp dt to prevent huge jumps (e.g., after tab switch)
  const dt = Math.min(rawDt / 16.667, 3);

  // --- START SCREEN ---
  if (gameState === State.START) {
    drawStartScreen(timestamp);
    requestAnimationFrame(gameLoop);
    return;
  }

  // --- PLAYING ---
  if (gameState === State.PLAYING) {
    if (!paused) {
      // Update
      updateBird(dt);
      updatePipes(dt);
      updateGround(dt);
      updateClouds(dt);

      // Collision check
      if (checkCollision()) {
        gameOver();
      }
    }

    // Render (always, even when paused, so the scene is visible)
    drawBackground();
    drawClouds();
    drawPipes();
    drawGround();
    drawBird();
    drawScore();

    if (paused) {
      drawPauseOverlay();
    }
  }

  // --- GAME OVER ---
  if (gameState === State.GAME_OVER) {
    // Draw the frozen scene
    drawBackground();
    drawClouds();
    drawPipes();
    drawGround();
    drawBird();
    drawScore();
    drawGameOverScreen();
  }

  requestAnimationFrame(gameLoop);
}


// =============================================================================
// INITIALIZATION
// =============================================================================
initClouds();
resetBird();
lastTime = 0;
requestAnimationFrame(gameLoop);
</script>
